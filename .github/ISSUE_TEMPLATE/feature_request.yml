name: Feature request
description: A new user-visible capability that does not exist today.
title: "feat(<area>): <outcome for the user>"
labels: ["type: feature", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Follow [the issue guidelines](../blob/main/.github/ISSUE_GUIDELINES.md). Describe the need before the solution.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 1–3 sentences.
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: User story
      value: |
        **As a** …
        **I want** …
        **so that** …
    validations:
      required: true

  - type: checkboxes
    id: areas
    attributes:
      label: Area
      options:
        - label: backend
        - label: frontend (React)
        - label: frontend-angular
        - label: infra / Docker
        - label: CI

  - type: textarea
    id: context
    attributes:
      label: Context and motivation
      description: Why now? Link the spec (`technical_analysis.md`, `development_phases.md`), the audit, or user feedback.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: UX flow, API endpoints and payloads, data model and migration, impact on both frontends.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] **Given** …, **when** …, **then** …
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Test plan

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope

  - type: textarea
    id: related
    attributes:
      label: Related

  - type: markdown
    attributes:
      value: |
        ### Definition of Done
        - [ ] All acceptance criteria are checked
        - [ ] Tests cover the new behaviour
        - [ ] CI (`test.yml`) is green
        - [ ] Implemented in both frontends (feature parity)
        - [ ] `CHANGELOG.md` and docs updated
        - [ ] PR into `dev` merged with `Closes #<issue>`
