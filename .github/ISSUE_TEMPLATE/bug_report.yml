name: Bug report
description: Existing behaviour is wrong. Reference example — .github/issues/H-1-server-errors-returned-as-401.md
title: "fix(<area>): <observable problem>"
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Follow [the issue guidelines](../blob/main/.github/ISSUE_GUIDELINES.md). One problem per issue.
        **Do not post tokens, passwords, e-mail addresses or personal locations.**
        Exploitable security weaknesses go to *Security → Report a vulnerability*, not here.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 1–3 sentences. What is wrong, and who notices it?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Impact, not urgency (priority is set at triage).
      options:
        - High — user-visible bug, data integrity issue or exploitable weakness
        - Medium — degrades security, reliability or maintainability
        - Low — hygiene, cosmetic, documentation
    validations:
      required: true

  - type: checkboxes
    id: areas
    attributes:
      label: Area
      options:
        - label: backend
        - label: frontend (React)
        - label: frontend-angular
        - label: infra / Docker
        - label: CI

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, how it runs (Docker stack, local dev, alpha tunnel), browser if relevant.
      value: |
        | | |
        |---|---|
        | Version | |
        | Commit | |
        | Runtime | |
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal and deterministic. Prefer `curl -i` commands for API bugs.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the response, the error message and the relevant log lines.
      render: text
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected, how often, and what workaround exists.
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: Root cause
      description: Why it happens, with `path/File.java:line` links. Leave empty if unknown; it must be filled before the issue is Ready.

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Classes to change, contracts (status codes, payloads), compatibility. Enough for a reviewer to disagree before code is written.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, pass/fail. Include failure paths and non-regression.
      value: |
        - [ ] **Given** …, **when** …, **then** …
        - [ ] **Non-regression:** …
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: Which tests prove the fix (unit, slice, integration, frontend, manual). One must fail without the fix.

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue does not cover, and where it is tracked.

  - type: textarea
    id: related
    attributes:
      label: Related
      description: Linked issues, PRs, audit IDs, docs.

  - type: markdown
    attributes:
      value: |
        ### Definition of Done
        - [ ] All acceptance criteria are checked
        - [ ] A regression test fails without the fix and passes with it
        - [ ] CI (`test.yml`) is green
        - [ ] Both frontends updated if the API contract changed
        - [ ] `CHANGELOG.md` updated with the bump type
        - [ ] PR into `dev` merged with `Closes #<issue>`
