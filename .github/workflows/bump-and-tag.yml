name: "Bump Version & Tag"

# Triggered after a merge to dev or test.
# First runs all tests (backend + frontend) as a gate, then reads bump type
# from CHANGELOG.md, increments version, commits, tags, and pushes.
# paths-ignore prevents this workflow from re-triggering on its own commits
# (which only touch CHANGELOG.md and package.json).
# The job-level 'if' is a safety net for mixed pushes (bot commit + other commits together).

on:
  push:
    branches:
      - dev
      - test
    paths-ignore:
      - "CHANGELOG.md"
      - "package.json"

jobs:
  # ─── Gate: Backend Tests ────────────────────────────────────
  backend-tests:
    name: "Backend Tests (Java 25)"
    if: "!contains(github.event.head_commit.message, '[bump_version]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Run Maven tests
        run: mvn -B clean verify --fail-at-end

  # ─── Gate: Frontend Tests ───────────────────────────────────
  frontend-tests:
    name: "Frontend Tests (Vitest)"
    if: "!contains(github.event.head_commit.message, '[bump_version]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

  # ─── Bump Version (only after tests pass) ───────────────────
  bump:
    name: "Bump Version & Tag"
    needs: [backend-tests, frontend-tests]
    if: "!contains(github.event.head_commit.message, '[bump_version]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BUMP_TOKEN || github.token }}
          fetch-depth: 0  # Full history needed for back-merge

      - name: Check Token Presence
        run: |
          if [ -z "${{ secrets.BUMP_TOKEN }}" ]; then
            echo "::warning::BUMP_TOKEN is empty. Falling back to GITHUB_TOKEN. Pushed tags will NOT trigger release workflows."
          else
            echo "✅ BUMP_TOKEN is present."
          fi

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bump_version.py
        run: python bump_version.py --ci