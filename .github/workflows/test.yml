name: "Test Suite"

# Runs backend (Java 25 / Maven) and frontend (Node / npm) tests
# on every push to feature branches and on every Pull Request targeting dev/test/main.
# Version bumping and Docker packaging are blocked if these tests fail.

on:
  pull_request:
    branches:
      - dev
      - test
      - main
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running pipeline
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend Tests (Java 25 + Maven) ───────────────────────
  backend-tests:
    name: "Backend Tests (Java 25)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Run Maven tests
        run: mvn -B clean verify --fail-at-end

  # ─── Frontend Tests (Node + npm) ───────────────────────────
  frontend-tests:
    name: "Frontend Tests (Vitest)"
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

      - name: Production build (tsc + vite)
        run: npm run build

  # ─── Frontend Angular Tests (Node + npm) ───────────────────
  frontend-angular-tests:
    name: "Frontend Angular Tests (Vitest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

  # ─── Production Docker images (build only, never pushed) ───
  # Proves the Dockerfiles still build once the test suites are green.
  docker-build:
    name: "Docker Build (${{ matrix.service }})"
    needs: [backend-tests, frontend-tests, frontend-angular-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, frontend-angular]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: remembermap-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ─── Compose file sanity check ─────────────────────────────
  compose-config:
    name: "Validate docker-compose.yml"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose configuration
        run: docker compose -f docker-compose.yml config --quiet
