name: "Create GitHub Release"

# Triggered when a version tag is pushed (by bump-and-tag.yml or manually).
# Extracts release notes from CHANGELOG.md and creates a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >> $GITHUB_ENV

          # Extract the section for this version from CHANGELOG.md
          # Matches: ## [vX.Y.Z-x] - YYYY-MM-DD ... until the next ## or end
          NOTES=$(python3 -c "
          import re, sys
          content = open('CHANGELOG.md', 'r', encoding='utf-8').read()
          tag = '${TAG}'
          escaped = re.escape(tag)
          pattern = rf'## \[{escaped}\].*?\n(.*?)(?=\n## |\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
              notes = re.sub(r'^# .*$', '', notes, flags=re.MULTILINE).strip()
              notes = re.sub(r'<!--.*?-->', '', notes, flags=re.DOTALL)
              notes = re.sub(r'(Backend|Frontend)?\s*Bump\s*:\s*\[?[0-9a-zA-Z_\-]+\]?', '', notes, flags=re.IGNORECASE)
              notes = re.sub(r'_Description:.*?_', '', notes)
              notes = re.sub(r'### ChangeLog\s*$', '', notes, flags=re.MULTILINE)
              notes = re.sub(r'\n---\s*$', '', notes).strip()

              def clean_empty_headers(text):
                  lines = text.split('\n')
                  # 1. Remove empty H4 (####) headers
                  result = []
                  i = 0
                  while i < len(lines):
                      line = lines[i]
                      if line.strip().startswith('####'):
                          has_content = False
                          j = i + 1
                          while j < len(lines):
                              nl = lines[j].strip()
                              if nl.startswith('#'):
                                  break
                              if nl and not nl.startswith('<!--'):
                                  has_content = True
                                  break
                              j += 1
                          if not has_content:
                              i += 1
                              continue
                      result.append(line)
                      i += 1

                  # 2. Remove empty H3 (###) headers
                  lines = result
                  result = []
                  i = 0
                  while i < len(lines):
                      line = lines[i]
                      if line.strip().startswith('### '):
                          has_content = False
                          j = i + 1
                          while j < len(lines):
                              nl = lines[j].strip()
                              if (nl.startswith('### ') or nl.startswith('## ') or nl.startswith('# ')) and not nl.startswith('#### '):
                                  break
                              if nl and not nl.startswith('<!--'):
                                  has_content = True
                                  break
                              j += 1
                          if not has_content:
                              i += 1
                              continue
                      result.append(line)
                      i += 1
                  return '\n'.join(result)

              notes = clean_empty_headers(notes)
              notes = re.sub(r'\n{3,}', '\n\n', notes).strip()
              print(notes)
          else:
              print(f'Release {tag}')
          ")

          # Write to file to avoid shell escaping issues
          echo "$NOTES" > release_notes.md

      - name: Determine pre-release status
        id: prerelease
        run: |
          if [[ "$TAG" == *"-a"* ]] || [[ "$TAG" == *"-b"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Release ${{ env.TAG }}"
          body_path: release_notes.md
          prerelease: ${{ env.IS_PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}