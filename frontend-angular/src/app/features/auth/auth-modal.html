@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div
      class="w-full max-w-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-xl shadow-2xl p-6 relative border border-gray-200 dark:border-gray-700"
    >
      <button
        type="button"
        aria-label="Close"
        (click)="closed.emit()"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 font-bold text-lg"
      >
        ✕
      </button>

      <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6">
        <button
          type="button"
          class="py-2 px-4 font-semibold text-sm transition-colors"
          [class]="
            !isSignUp()
              ? 'border-b-2 border-blue-600 text-blue-600 dark:text-blue-400'
              : 'text-gray-500 dark:text-gray-400'
          "
          (click)="setMode(false)"
        >
          Sign In
        </button>
        <button
          type="button"
          class="py-2 px-4 font-semibold text-sm transition-colors"
          [class]="
            isSignUp()
              ? 'border-b-2 border-blue-600 text-blue-600 dark:text-blue-400'
              : 'text-gray-500 dark:text-gray-400'
          "
          (click)="setMode(true)"
        >
          Sign Up
        </button>
      </div>

      <h2 class="text-xl font-bold mb-4 text-gray-900 dark:text-white">
        {{ isSignUp() ? 'Create Account' : 'Sign In' }}
      </h2>

      @if (error()) {
        <div
          class="mb-4 p-3 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm rounded-lg"
        >
          {{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" data-testid="auth-form" class="space-y-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          <span class="block mb-1">Username</span>
          <input type="text" formControlName="username" required placeholder="Username" [class]="inputClass" />
        </label>

        @if (isSignUp()) {
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            <span class="block mb-1">Email</span>
            <input type="email" formControlName="email" required placeholder="Email" [class]="inputClass" />
          </label>
        }

        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          <span class="block mb-1">Password</span>
          <input type="password" formControlName="password" required placeholder="Password" [class]="inputClass" />
        </label>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow-md"
        >
          {{ loading() ? 'Processing...' : isSignUp() ? 'Sign Up' : 'Sign In' }}
        </button>
      </form>
    </div>
  </div>
}
