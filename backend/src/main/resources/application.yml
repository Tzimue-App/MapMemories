spring:
  application:
    name: remembermap-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/remembermap}
    username: ${SPRING_DATASOURCE_USERNAME:remembermap}
    password: ${SPRING_DATASOURCE_PASSWORD:remembermap}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Phone photos routinely exceed Spring's 1MB default; they are resized server-side after upload
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:15MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:16MB}

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  # Runs behind the nginx frontends, which set X-Forwarded-* headers
  forward-headers-strategy: framework
  shutdown: graceful

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:remembermap_access}
  secretKey: ${MINIO_SECRET_KEY:remembermap_secret}
  bucket: ${MINIO_BUCKET:remembermap-photos}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
