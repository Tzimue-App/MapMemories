# Production-style orchestration. Secrets come from a .env file next to this one
# (copy .env.example -> .env and change every value before exposing the stack).
# The defaults below only exist so `docker compose up` works out of the box locally.

x-db-credentials: &db-credentials
  POSTGRES_DB: ${POSTGRES_DB:-remembermap}
  POSTGRES_USER: ${POSTGRES_USER:-remembermap}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remembermap}

services:
  # ─── Database (PostgreSQL + PostGIS) ────────────────────────
  postgres:
    image: postgis/postgis:17-3.6-alpine
    container_name: remembermap-postgres
    restart: unless-stopped
    environment:
      <<: *db-credentials
    # Bound to localhost only: reachable for local tooling, never from the network
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Object Storage (MinIO) ─────────────────────────────────
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: remembermap-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-remembermap_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-remembermap_secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Helper container to auto-create the MinIO photo bucket on start
  minio-create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: remembermap-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-remembermap_access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-remembermap_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-remembermap-photos}
    # Photos are streamed through the authenticated API, so the bucket stays private
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      /usr/bin/mc mb --ignore-existing myminio/$${MINIO_BUCKET};
      exit 0;
      "

  # ─── Backend API (Java 25 Spring Boot) ─────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: remembermap-backend:${APP_VERSION:-local}
    container_name: remembermap-backend
    restart: unless-stopped
    # Only the nginx frontends talk to the API; publish on localhost for local debugging
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-remembermap}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-remembermap}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-remembermap}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-remembermap_access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-remembermap_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-remembermap-photos}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    depends_on:
      postgres:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g

  # ─── Frontend Application (React + TypeScript + Vite) ──────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: remembermap-frontend:${APP_VERSION:-local}
    container_name: remembermap-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  # ─── Frontend Application (Angular 21) — same features, same backend ──
  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    image: remembermap-frontend-angular:${APP_VERSION:-local}
    container_name: remembermap-frontend-angular
    restart: unless-stopped
    ports:
      - "${FRONTEND_ANGULAR_PORT:-3001}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
